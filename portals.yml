search_queries:
  - name: "LinkedIn/Indeed-style — ITOps Dubai"
    query: '("IT Operations Engineer" OR "Senior System Administrator" OR "Workplace IT Lead") "Dubai" OR "UAE"'
    enabled: true
  - name: "Greenhouse — ITOps / Workplace / Business Systems"
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "IT Operations" OR "Workplace Technology" OR "Business Systems" OR "Modern Workplace"'
    enabled: true
  - name: "Lever — ITOps / IT Manager"
    query: 'site:jobs.lever.co "IT Operations" OR "IT Manager" OR "Systems Administrator" OR "Workplace IT"'
    enabled: true
  - name: "Ashby — IT Infrastructure / Automation"
    query: 'site:jobs.ashbyhq.com "IT Operations" OR "IT Infrastructure" OR "Automation Engineer" OR "Business Systems"'
    enabled: true
  - name: "Gulf boards — Senior IT (Dubai/GCC)"
    query: 'site:bayt.com OR site:gulftalent.com "IT Operations" OR "Senior IT" OR "System Administrator" Dubai OR "Saudi Arabia" OR Qatar OR "Abu Dhabi"'
    enabled: true
  - name: "LinkedIn — Senior ITOps Gulf"
    query: 'site:linkedin.com/jobs "IT Operations" OR "Workplace Technology" OR "IT Manager" Dubai OR UAE OR Riyadh'
    enabled: true
  - name: "Remote — Workplace/Collab IT (worldwide)"
    query: '("Workplace IT Lead" OR "Collaboration Engineer" OR "IT Operations Engineer") remote EMEA OR worldwide'
    enabled: true
  - name: "Remote — IT Automation / n8n"
    query: '("IT Automation" OR "n8n" OR "workflow automation engineer") remote "IT"'
    enabled: true
  - name: "Leadership — IT Manager / Head of IT (Dubai/GCC)"
    query: '("IT Manager" OR "Head of IT" OR "IT Operations Manager" OR "Technology Manager") Dubai OR UAE OR Riyadh OR Doha OR "Saudi Arabia"'
    enabled: true
  - name: "Leadership — ATS portals (Greenhouse/Lever/Ashby)"
    query: 'site:boards.greenhouse.io OR site:jobs.lever.co OR site:jobs.ashbyhq.com "IT Manager" OR "Head of IT" OR "Engineering Manager, IT" OR "IT Operations Manager"'
    enabled: true
  - name: "DevOps / Cloud Infra — Dubai/GCC"
    query: '("DevOps Engineer" OR "Cloud Infrastructure Engineer" OR "Site Reliability Engineer") Dubai OR UAE OR Riyadh OR remote GCC'
    enabled: true
  - name: "AI / MLOps — remote + Gulf"
    query: '("AI Engineer" OR "MLOps" OR "AI Operations" OR "LLM Ops") remote OR Dubai OR UAE'
    enabled: true
  - name: "Dubizzle — IT jobs Dubai"
    query: 'site:dubizzle.com/en/it-jobs OR dubizzle "IT" jobs Dubai "IT Manager" OR "IT Support" OR "System Administrator" OR "IT Operations"'
    enabled: true
  - name: "Dubizzle classifieds — IT Manager / IT Engineer"
    query: 'dubizzle.com "IT Manager" OR "IT Engineer" OR "IT Administrator" Dubai jobs'
    enabled: true
  - name: "Other classifieds / local boards — Gulf IT"
    query: 'finddubaijob OR dubaicraigslist OR "gulf list" OR bayt classifieds "IT Manager" OR "IT Operations" OR "System Administrator" Dubai OR UAE'
    enabled: true
  - name: "Reddit — Dubai/GCC job subreddits"
    query: 'site:reddit.com/r/dubaijobs OR site:reddit.com/r/UAEJobs OR site:reddit.com/r/gulfjobs "IT" hiring OR job'
    enabled: true
  - name: "Reddit — general job subreddits (IT/DevOps/AI)"
    query: 'site:reddit.com/r/jobbit OR site:reddit.com/r/forhire OR site:reddit.com/r/remotejs "IT Operations" OR "IT Manager" OR "DevOps" OR "SysAdmin"'
    enabled: true
  - name: "Reddit — search IT jobs Dubai/UAE"
    query: 'reddit.com "IT Manager" OR "IT Operations" Dubai OR UAE job hiring 2026'
    enabled: true

# Tracked companies: add verified careers URLs here as the campaign matures.
# Prefer branded careers pages (✅ https://careers.example.com) over raw ATS URLs.
# None pre-filled — nothing invented. Ask the agent to research and add companies
# you actually want (e.g. target employers in Dubai/GCC) with verified URLs.
tracked_companies: []
